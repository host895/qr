
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">

<title>Easy Trick - QR Code Generator</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #000;
    --panel-bg: rgba(5,5,5,.85);
    --neon-blue: #00f3ff;
    --neon-red: #ff003c;
    --text-main: #e0e0e0;
    --text-muted: #888;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background-color: var(--bg);
    background-image:
        radial-gradient(circle at 50% 0%,rgba(0,243,255,.1),transparent 50%),
        radial-gradient(circle at 100% 100%,rgba(255,0,60,.05),transparent 50%),
        linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
    background-size: 100% 100%,100% 100%,30px 30px,30px 30px;
    color: var(--text-main);
    font-family: 'Share Tech Mono',monospace;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    background: var(--panel-bg);
    border: 1px solid rgba(0,243,255,.3);
    border-radius: 8px;
    width: 100%;
    max-width: 700px;
    padding: 40px 30px;
    box-shadow: 0 0 20px rgba(0,243,255,.1),inset 0 0 20px rgba(0,243,255,.05);
    position: relative;
    backdrop-filter: blur(10px);
}

.container::before,
.container::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    pointer-events: none;
}

.container::before {
    top: -1px;
    left: -1px;
    border-top: 2px solid var(--neon-blue);
    border-left: 2px solid var(--neon-blue);
}

.container::after {
    bottom: -1px;
    right: -1px;
    border-bottom: 2px solid var(--neon-red);
    border-right: 2px solid var(--neon-red);
}

.header {
    text-align: center;
    margin-bottom: 35px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.logo-placeholder {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 2px dashed var(--neon-blue);
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 15px;
    box-shadow: 0 0 15px rgba(0,243,255,.2);
    overflow: hidden;
    background: #000;
}

.logo-placeholder img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.header h1 {
    font-family: 'Orbitron',sans-serif;
    font-size: 32px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 10px var(--neon-blue),0 0 20px var(--neon-blue);
    letter-spacing: 2px;
    margin-bottom: 5px;
    text-transform: uppercase;
}

.header p {
    color: var(--neon-blue);
    font-size: 14px;
    letter-spacing: 1px;
}

.input-group {
    position: relative;
    margin-bottom: 25px;
}

.input-group svg {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 21px;
    height: 21px;
    fill: none;
    stroke: var(--neon-blue);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 5px var(--neon-blue));
}

.input-group input {
    width: 100%;
    background: rgba(0,0,0,.6);
    border: 1px solid #333;
    border-radius: 4px;
    padding: 16px 16px 16px 50px;
    color: var(--neon-blue);
    font-family: 'Share Tech Mono',monospace;
    font-size: 16px;
    outline: none;
    transition: all .3s;
}

.input-group input:focus {
    border-color: var(--neon-blue);
    box-shadow: 0 0 15px rgba(0,243,255,.3);
    background: rgba(0,243,255,.05);
}

.input-group input::placeholder {
    color: var(--text-muted);
}

.btn {
    width: 100%;
    padding: 16px;
    border: 1px solid var(--neon-blue);
    border-radius: 4px;
    font-size: 18px;
    font-family: 'Orbitron',sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: all .3s;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    background: transparent;
    color: var(--neon-blue);
    box-shadow: 0 0 10px rgba(0,243,255,.2),inset 0 0 10px rgba(0,243,255,.1);
}

.btn-primary:hover {
    background: var(--neon-blue);
    color: #000;
    box-shadow: 0 0 20px rgba(0,243,255,.6);
}

.result-box {
    margin-top: 25px;
    display: none;
    animation: fadeIn .4s ease;
    text-align: center;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.result-title {
    color: var(--neon-blue);
    font-size: 16px;
    margin-bottom: 18px;
    letter-spacing: 1px;
}

.qr-container {
    background: #fff;
    padding: 18px;
    border-radius: 8px;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    margin: 0 auto 20px;
    box-shadow: 0 0 20px rgba(0,243,255,.25);
    max-width: 100%;
}

#qrcode img,
#qrcode canvas {
    display: block;
    max-width: 100%;
    height: auto;
}

.color-panel {
    border: 1px solid #333;
    background: rgba(0,0,0,.55);
    padding: 18px;
    border-radius: 6px;
    margin-bottom: 20px;
    text-align: left;
}

.color-title {
    color: var(--neon-blue);
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 15px;
    text-align: center;
}

.color-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.color-option {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.color-option label {
    color: #aaa;
    font-size: 12px;
}

.color-input-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #111;
    border: 1px solid #333;
    padding: 7px;
    border-radius: 4px;
}

.color-input-wrap input[type="color"] {
    width: 35px;
    height: 30px;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 0;
}

.color-value {
    color: #ddd;
    font-size: 12px;
    text-transform: uppercase;
}

.preview-frame {
    position: relative;
    display: inline-block;
    padding: 10px;
    border: 1px solid #333;
    border-radius: 5px;
    margin-bottom: 20px;
}

.preview-frame::before,
.preview-frame::after {
    content: '';
    position: absolute;
    width: 22px;
    height: 22px;
    pointer-events: none;
}

.preview-frame::before {
    top: -1px;
    left: -1px;
    border-top: 3px solid var(--border-top);
    border-left: 3px solid var(--border-top);
    filter: drop-shadow(0 0 5px var(--border-top));
}

.preview-frame::after {
    bottom: -1px;
    right: -1px;
    border-bottom: 3px solid var(--border-bottom);
    border-right: 3px solid var(--border-bottom);
    filter: drop-shadow(0 0 5px var(--border-bottom));
}

.btn-share {
    border-color: var(--neon-red);
    color: var(--neon-red);
    box-shadow: 0 0 10px rgba(255,0,60,.2),inset 0 0 10px rgba(255,0,60,.1);
}

.btn-share:hover {
    background: var(--neon-red);
    color: #000;
    box-shadow: 0 0 20px rgba(255,0,60,.6);
}

.status {
    color: var(--neon-blue);
    font-size: 13px;
    margin-top: 15px;
    display: none;
    line-height: 1.6;
}

@media(max-width:600px) {
    .container {
        padding: 30px 20px;
    }

    .header h1 {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo-placeholder">
            <img
                src="https://i.ibb.co/vvg2sGhf/1794889466796.jpg"
                alt="Easy Trick Logo"
                onerror="this.style.display='none';">
        </div>

        <h1>Easy Trick</h1>
        <p>QR Code Generator</p>
    </div>

    <div class="input-group">
        <input
            type="url"
            id="url"
            placeholder="Enter Your URL"
            autocomplete="url">

        <svg viewBox="0 0 24 24">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
    </div>

    <button class="btn btn-primary" onclick="generateQR()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm8-2h2v2h-2zm4 0h4v4h-2v-2h-2zm-4 4h2v4h-2zm4 0h2v2h2v2h-4z"/>
        </svg>
        Generate QR Code
    </button>

    <div class="result-box" id="resultBox">

        <p class="result-title">YOUR QR CODE IS READY</p>

        <div class="preview-frame" id="previewFrame">
            <div class="qr-container">
                <div id="qrcode"></div>
            </div>
        </div>

        <div class="color-panel">

            <p class="color-title">CUSTOMIZE QR FRAME COLORS</p>

            <div class="color-options">

                <div class="color-option">
                    <label for="topColor">TOP / LEFT BORDER</label>
                    <div class="color-input-wrap">
                        <input
                            type="color"
                            id="topColor"
                            value="#00f3ff"
                            oninput="updateColors()">
                        <span class="color-value" id="topColorValue">#00F3FF</span>
                    </div>
                </div>

                <div class="color-option">
                    <label for="bottomColor">BOTTOM / RIGHT BORDER</label>
                    <div class="color-input-wrap">
                        <input
                            type="color"
                            id="bottomColor"
                            value="#ff003c"
                            oninput="updateColors()">
                        <span class="color-value" id="bottomColorValue">#FF003C</span>
                    </div>
                </div>

            </div>
        </div>

        <button class="btn btn-share" onclick="shareQR()">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor">
                <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7a3.1 3.1 0 0 0 0-1.39l7.05-4.11A3 3 0 1 0 15 5c0 .23.03.46.08.68L8.03 9.79a3 3 0 1 0 0 4.42l7.12 4.16c-.05.2-.07.41-.07.63a2.92 2.92 0 1 0 2.92-2.92z"/>
            </svg>
            Share QR Code
        </button>

        <p class="status" id="status"></p>

    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

function updateColors() {

    const topColor = document.getElementById("topColor").value;
    const bottomColor = document.getElementById("bottomColor").value;

    document.documentElement.style.setProperty("--border-top", topColor);
    document.documentElement.style.setProperty("--border-bottom", bottomColor);

    document.getElementById("topColorValue").textContent = topColor.toUpperCase();
    document.getElementById("bottomColorValue").textContent = bottomColor.toUpperCase();
}

updateColors();


function generateQR() {

    const url = document.getElementById("url").value.trim();

    if (!url) {
        alert("Please enter a URL first!");
        return;
    }

    try {

        const parsed = new URL(url);

        if (!["http:", "https:"].includes(parsed.protocol)) {
            alert("Please enter a valid URL!");
            return;
        }

        const qrContainer = document.getElementById("qrcode");

        qrContainer.innerHTML = "";

        new QRCode(qrContainer, {
            text: url,
            width: 240,
            height: 240,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        document.getElementById("resultBox").style.display = "block";
        document.getElementById("status").style.display = "none";

        setTimeout(() => {
            updateColors();
        }, 100);

    } catch (error) {
        alert("Please enter a valid URL!");
    }
}


function createDesignedImage(qrCanvas) {

    return new Promise((resolve, reject) => {

        const width = 420;
        const height = 470;

        const canvas = document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");

        if (!ctx) {
            reject(new Error("Canvas is not supported"));
            return;
        }

        const topColor = document.getElementById("topColor").value;
        const bottomColor = document.getElementById("bottomColor").value;

        // Background
        ctx.fillStyle = "#050505";
        ctx.fillRect(0, 0, width, height);

        // Subtle background glow
        const glow = ctx.createRadialGradient(
            width / 2, 150, 10,
            width / 2, 150, 260
        );

        glow.addColorStop(0, topColor + "30");
        glow.addColorStop(1, "#050505");

        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, width, height);

        // Main outer frame
        ctx.strokeStyle = "#333333";
        ctx.lineWidth = 2;
        ctx.strokeRect(20, 20, width - 40, height - 40);

        // Top left neon corners
        ctx.save();

        ctx.strokeStyle = topColor;
        ctx.lineWidth = 5;
        ctx.shadowColor = topColor;
        ctx.shadowBlur = 18;

        ctx.beginPath();
        ctx.moveTo(20, 70);
        ctx.lineTo(20, 20);
        ctx.lineTo(70, 20);
        ctx.stroke();

        ctx.restore();

        // Bottom right neon corners
        ctx.save();

        ctx.strokeStyle = bottomColor;
        ctx.lineWidth = 5;
        ctx.shadowColor = bottomColor;
        ctx.shadowBlur = 18;

        ctx.beginPath();
        ctx.moveTo(width - 70, height - 20);
        ctx.lineTo(width - 20, height - 20);
        ctx.lineTo(width - 20, height - 70);
        ctx.stroke();

        ctx.restore();

        // Brand title
        ctx.save();

        ctx.fillStyle = "#ffffff";
        ctx.font = "900 27px Arial";
        ctx.textAlign = "center";
        ctx.shadowColor = topColor;
        ctx.shadowBlur = 12;

        ctx.fillText("EASY TRICK", width / 2, 80);

        ctx.restore();

        // Subtitle
        ctx.fillStyle = topColor;
        ctx.font = "15px Arial";
        ctx.textAlign = "center";
        ctx.fillText("QR CODE GENERATOR", width / 2, 108);

        // QR white background
        const qrSize = 260;
        const qrX = (width - qrSize) / 2;
        const qrY = 135;

        ctx.save();

        ctx.shadowColor = topColor;
        ctx.shadowBlur = 18;

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(qrX - 10, qrY - 10, qrSize + 20, qrSize + 20);

        ctx.restore();

        // QR image
        ctx.drawImage(
            qrCanvas,
            qrX,
            qrY,
            qrSize,
            qrSize
        );

        // Bottom label
        ctx.fillStyle = "#aaaaaa";
        ctx.font = "13px Arial";
        ctx.textAlign = "center";
        ctx.fillText("GENERATED WITH EASY TRICK", width / 2, 435);

        // Export PNG
        canvas.toBlob(blob => {

            if (blob) {
                resolve(blob);
            } else {
                reject(new Error("Image export failed"));
            }

        }, "image/png");
    });
}


async function shareQR() {

    const qrCanvas = document.querySelector("#qrcode canvas");
    const status = document.getElementById("status");

    if (!qrCanvas) {
        alert("Please generate a QR Code first!");
        return;
    }

    status.style.display = "block";
    status.textContent = "Preparing your designed QR Code...";

    try {

        const blob = await createDesignedImage(qrCanvas);

        const file = new File(
            [blob],
            "Easy-Trick-QR-Code.png",
            { type: "image/png" }
        );

        if (
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({ files: [file] })
        ) {

            await navigator.share({
                files: [file],
                title: "Easy Trick QR Code"
            });

            status.textContent = "QR Code shared successfully!";
            return;
        }

        // Fallback: open the designed image
        const imageURL = URL.createObjectURL(blob);

        const preview = window.open("", "_blank");

        if (preview) {

            preview.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1">
                    <title>Easy Trick QR Code</title>
                    <style>
                        body {
                            margin: 0;
                            padding: 20px;
                            background: #000;
                            color: #00f3ff;
                            font-family: Arial;
                            text-align: center;
                        }
                        img {
                            display: block;
                            width: 100%;
                            max-width: 420px;
                            margin: 25px auto;
                        }
                        p {
                            color: #aaa;
                            line-height: 1.6;
                        }
                    </style>
                </head>
                <body>
                    <h3>EASY TRICK QR CODE</h3>
                    <p>Long press the image to save or share it.</p>
                    <img src="${imageURL}" alt="QR Code">
                </body>
                </html>
            `);

            preview.document.close();

            status.textContent = "Image opened. Long press it to save or share.";

        } else {

            status.textContent = "Sharing is not supported here. Please open the website in Chrome.";

        }

    } catch (error) {

        if (error.name === "AbortError") {
            status.style.display = "none";
            return;
        }

        console.error(error);

        status.textContent = "Unable to share image. Please try again.";

    }
}


if (window.Telegram && window.Telegram.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
}

</script>

</body>
</html>
