
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Trick - QR Code Generator</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #000;
    --panel-bg: rgba(5,5,5,.85);
    --neon-blue: #00f3ff;
    --neon-red: #ff003c;
    --text-main: #e0e0e0;
    --text-muted: #888;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background-color: var(--bg);
    background-image:
        radial-gradient(circle at 50% 0%,rgba(0,243,255,.1),transparent 50%),
        radial-gradient(circle at 100% 100%,rgba(255,0,60,.05),transparent 50%),
        linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
    background-size: 100% 100%,100% 100%,30px 30px,30px 30px;
    color: var(--text-main);
    font-family: 'Share Tech Mono',monospace;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    background: var(--panel-bg);
    border: 1px solid rgba(0,243,255,.3);
    border-radius: 8px;
    width: 100%;
    max-width: 700px;
    padding: 40px 30px;
    box-shadow: 0 0 20px rgba(0,243,255,.1),inset 0 0 20px rgba(0,243,255,.05);
    position: relative;
    backdrop-filter: blur(10px);
}

.container::before,
.container::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    pointer-events: none;
}

.container::before {
    top: -1px;
    left: -1px;
    border-top: 2px solid var(--neon-blue);
    border-left: 2px solid var(--neon-blue);
}

.container::after {
    bottom: -1px;
    right: -1px;
    border-bottom: 2px solid var(--neon-red);
    border-right: 2px solid var(--neon-red);
}

.header {
    text-align: center;
    margin-bottom: 35px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.logo-placeholder {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 2px dashed var(--neon-blue);
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 15px;
    box-shadow: 0 0 15px rgba(0,243,255,.2);
    overflow: hidden;
    background: #000;
}

.logo-placeholder img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.header h1 {
    font-family: 'Orbitron',sans-serif;
    font-size: 32px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 10px var(--neon-blue),0 0 20px var(--neon-blue);
    letter-spacing: 2px;
    margin-bottom: 5px;
    text-transform: uppercase;
}

.header p {
    color: var(--neon-blue);
    font-size: 14px;
    letter-spacing: 1px;
}

.input-group {
    position: relative;
    margin-bottom: 25px;
}

.input-group svg {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 21px;
    height: 21px;
    fill: none;
    stroke: var(--neon-blue);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 5px var(--neon-blue));
}

.input-group input {
    width: 100%;
    background: rgba(0,0,0,.6);
    border: 1px solid #333;
    border-radius: 4px;
    padding: 16px 16px 16px 50px;
    color: var(--neon-blue);
    font-family: 'Share Tech Mono',monospace;
    font-size: 16px;
    outline: none;
    transition: all .3s;
}

.input-group input:focus {
    border-color: var(--neon-blue);
    box-shadow: 0 0 15px rgba(0,243,255,.3);
    background: rgba(0,243,255,.05);
}

.input-group input::placeholder {
    color: var(--text-muted);
}

.btn {
    width: 100%;
    padding: 16px;
    border: 1px solid var(--neon-blue);
    border-radius: 4px;
    font-size: 18px;
    font-family: 'Orbitron',sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: all .3s;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    background: transparent;
    color: var(--neon-blue);
    box-shadow: 0 0 10px rgba(0,243,255,.2),inset 0 0 10px rgba(0,243,255,.1);
}

.btn-primary:hover {
    background: var(--neon-blue);
    color: #000;
    box-shadow: 0 0 20px rgba(0,243,255,.6);
}

.result-box {
    margin-top: 25px;
    display: none;
    animation: fadeIn .4s ease;
    text-align: center;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.result-title {
    color: var(--neon-blue);
    font-size: 16px;
    margin-bottom: 18px;
    letter-spacing: 1px;
}

.qr-container {
    background: #fff;
    padding: 18px;
    border-radius: 8px;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    margin: 0 auto 20px;
    box-shadow: 0 0 20px rgba(0,243,255,.25);
    max-width: 100%;
}

#qrcode img,
#qrcode canvas {
    display: block;
    max-width: 100%;
    height: auto;
}

.btn-download {
    border-color: var(--neon-red);
    color: var(--neon-red);
    box-shadow: 0 0 10px rgba(255,0,60,.2),inset 0 0 10px rgba(255,0,60,.1);
}

.btn-download:hover {
    background: var(--neon-red);
    color: #000;
    box-shadow: 0 0 20px rgba(255,0,60,.6);
}

@media(max-width:600px) {
    .container {
        padding: 30px 20px;
    }

    .header h1 {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo-placeholder">
            <img
                src="https://i.ibb.co/vvg2sGhf/1794889466796.jpg"
                alt="Easy Trick Logo"
                onerror="this.style.display='none';">
        </div>

        <h1>Easy Trick</h1>
        <p>QR Code Generator</p>
    </div>

    <div class="input-group">

        <input
            type="url"
            id="url"
            placeholder="Enter Your URL"
            autocomplete="url">

        <svg viewBox="0 0 24 24">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>

    </div>

    <button class="btn btn-primary" onclick="generateQR()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm8-2h2v2h-2zm4 0h4v4h-2v-2h-2zm-4 4h2v4h-2zm4 0h2v2h2v2h-4z"/>
        </svg>
        Generate QR Code
    </button>

    <div class="result-box" id="resultBox">

        <p class="result-title">YOUR QR CODE IS READY</p>

        <div class="qr-container">
            <div id="qrcode"></div>
        </div>

        <button class="btn btn-download" onclick="downloadQR()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
            </svg>
            Download QR Code
        </button>

    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

function generateQR() {

    const url = document.getElementById("url").value.trim();

    if (!url) {
        alert("Please enter a URL first!");
        return;
    }

    try {

        const parsed = new URL(url);

        if (!["http:", "https:"].includes(parsed.protocol)) {
            alert("Please enter a valid URL!");
            return;
        }

        const qrContainer = document.getElementById("qrcode");

        qrContainer.innerHTML = "";

        new QRCode(qrContainer, {
            text: url,
            width: 240,
            height: 240,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        document.getElementById("resultBox").style.display = "block";

    } catch (error) {
        alert("Please enter a valid URL!");
    }
}


async function downloadQR() {

    const qrContainer = document.getElementById("qrcode");
    const canvas = qrContainer.querySelector("canvas");

    if (!canvas) {
        alert("Please generate a QR Code first!");
        return;
    }

    try {

        const blob = await new Promise(resolve => {
            canvas.toBlob(resolve, "image/png");
        });

        if (!blob) {
            throw new Error("Image creation failed");
        }

        const file = new File(
            [blob],
            "Easy-Trick-QR-Code.png",
            { type: "image/png" }
        );

        // Try native sharing on supported devices
        if (
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({ files: [file] })
        ) {
            try {
                await navigator.share({
                    files: [file],
                    title: "Easy Trick QR Code"
                });

                return;

            } catch (error) {

                if (error.name === "AbortError") {
                    return;
                }
            }
        }

        // Fallback: open the QR image in a new page
        const imageURL = URL.createObjectURL(blob);

        const preview = window.open("", "_blank");

        if (preview) {

            preview.document.write(`
                <!DOCTYPE html>
                <html lang="en">
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">

                    <title>Easy Trick QR Code</title>

                    <style>
                        * {
                            box-sizing: border-box;
                        }

                        body {
                            margin: 0;
                            padding: 25px 15px;
                            min-height: 100vh;
                            background: #000;
                            color: #00f3ff;
                            font-family: Arial, sans-serif;
                            display: flex;
                            flex-direction: column;
                            align-items: center;
                            justify-content: center;
                            text-align: center;
                        }

                        h2 {
                            text-shadow: 0 0 12px #00f3ff;
                        }

                        p {
                            color: #aaa;
                            line-height: 1.6;
                        }

                        img {
                            width: 90%;
                            max-width: 350px;
                            height: auto;
                            background: #fff;
                            padding: 12px;
                            border-radius: 8px;
                            margin-top: 20px;
                        }

                        a {
                            margin-top: 25px;
                            padding: 14px 25px;
                            color: #ff003c;
                            border: 1px solid #ff003c;
                            border-radius: 5px;
                            text-decoration: none;
                            font-weight: bold;
                        }
                    </style>
                </head>

                <body>

                    <h2>EASY TRICK QR CODE</h2>

                    <p>Long press the QR Code image and select Save Image.</p>

                    <img
                        src="${imageURL}"
                        alt="QR Code">

                    <a href="${imageURL}" download="Easy-Trick-QR-Code.png">
                        DOWNLOAD IMAGE
                    </a>

                </body>
                </html>
            `);

            preview.document.close();

        } else {

            // Last fallback
            const link = document.createElement("a");

            link.href = imageURL;
            link.download = "Easy-Trick-QR-Code.png";

            document.body.appendChild(link);
            link.click();
            link.remove();

        }

    } catch (error) {

        alert("Unable to download QR Code. Please try opening the website in Chrome.");

    }
}

</script>

</body>
</html>
